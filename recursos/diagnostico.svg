<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="t d"><title id="t">Percurso de diagnóstico</title><desc id="d">Observar, formular hipótese, testar, corrigir e repetir o teste. Registar evidências em cada etapa.</desc><rect width="1000" height="230" rx="16" fill="#eef3fa"/><g font-family="Arial,sans-serif" fill="#174ea6" text-anchor="middle"><text x="500" y="40" font-size="24" font-weight="bold">Diagnosticar por evidências</text><g font-size="20"><text x="105" y="112">Observar</text><text x="290" y="112">Hipótese</text><text x="480" y="112">Testar</text><text x="670" y="112">Corrigir</text><text x="870" y="112">Retestar</text></g><g stroke="#174ea6" stroke-width="2"><path d="M165 105h50m-10-7 10 7-10 7M355 105h50m-10-7 10 7-10 7M545 105h50m-10-7 10 7-10 7M745 105h50m-10-7 10 7-10 7" fill="none"/></g><text x="500" y="180" font-size="18" fill="#202735">Registar o que foi observado, o que mudou e o resultado do novo teste.</text></g></svg>
